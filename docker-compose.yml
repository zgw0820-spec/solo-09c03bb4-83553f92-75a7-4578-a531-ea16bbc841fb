services:
  scheduler:
    build: .
    image: mpi-backfill-scheduler:latest
    container_name: mpi-backfill-scheduler
    ports:
      - "8000:8000"
    environment:
      # 机架拓扑：逗号分隔各机架节点数；3x4 表示 4 个机架、每个 3 节点
      CLUSTER_RACKS: "4,4"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
